<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — NorseLift</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#e6eef8" id="meta-theme" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Self-hosted fonts (no Google Fonts requests) -->
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/crimson-pro-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <!-- Analytics consent: Google Analytics loads only after "Accept" -->
  <script src="/consent.js"></script>

  <!-- Prevent flash: apply saved theme before paint -->
  <script>
    (function() {
      var saved = localStorage.getItem('norselift-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var mc = document.getElementById('meta-theme');
      if (mc) mc.setAttribute('content', theme === 'dark' ? '#0a0e1a' : '#e6eef8');
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root, [data-theme="light"] {
      --bg: #e6eef8;
      --bg-end: #f2f5fa;
      --surface: #ffffff;
      --border: #c8d4e4;
      --text: #1a1e30;
      --text-secondary: #4a5268;
      --text-muted: #7e86a0;
      --accent: #4a90d9;
      --accent-dark: #3670a8;
      --nav-bg: rgba(230, 238, 248, 0.8);
      --btn-accent-text: #fff;
    }

    [data-theme="dark"] {
      --bg: #0a0e1a;
      --bg-end: #0a0e1a;
      --surface: #0f1424;
      --border: #1e2740;
      --text: #e4e4ef;
      --text-secondary: #8e92a8;
      --text-muted: #555a70;
      --accent: #6aabef;
      --accent-dark: #4a8ec9;
      --nav-bg: rgba(6, 10, 20, 0.8);
      --btn-accent-text: #0a0e1a;
    }

    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-end) 100%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      transition: background 0.4s, color 0.3s;
    }

    .container { max-width: 720px; margin: 0 auto; padding: 0 24px; }

    /* Nav */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      background: var(--nav-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1120px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      height: 72px;
    }
    .logo {
      font-family: 'Crimson Pro', serif;
      font-size: 1.4rem; font-weight: 800;
      display: flex; align-items: center; gap: 12px;
      text-decoration: none; color: var(--text);
    }
    .logo-mark {
      width: 40px; height: 40px; border-radius: 10px;
      overflow: hidden;
    }
    .logo-mark img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .theme-toggle {
      width: 38px; height: 38px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, background 0.3s;
      color: var(--text-muted);
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .theme-toggle .icon-sun, .theme-toggle .icon-moon { display: none; }
    [data-theme="light"] .theme-toggle .icon-moon { display: block; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }

    /* Content */
    .content {
      padding: 120px 0 80px;
    }
    .content h1 {
      font-family: 'Crimson Pro', serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .content .updated {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 40px;
    }
    .content h2 {
      font-family: 'Crimson Pro', serif;
      font-size: 1.2rem;
      font-weight: 800;
      margin-top: 36px;
      margin-bottom: 12px;
      color: var(--accent);
    }
    .content p {
      margin-bottom: 16px;
      color: var(--text-secondary);
      line-height: 1.8;
    }
    .content ul {
      margin-bottom: 16px;
      padding-left: 24px;
    }
    .content li {
      color: var(--text-secondary);
      margin-bottom: 8px;
      line-height: 1.7;
    }
    .content a {
      color: var(--accent);
      text-decoration: none;
    }
    .content a:hover {
      text-decoration: underline;
    }

    .content h3 { font-family: 'Inter', sans-serif; font-size: 1rem; font-weight: 700; margin: 28px 0 10px; color: var(--text); }
    .content strong { color: var(--text); }
    .content code { font-size: 0.85em; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
    .content .note { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 12px; padding: 14px 18px; margin: 0 0 28px; color: var(--text-secondary); font-size: 0.95rem; line-height: 1.7; }
    .content .table-wrap { overflow-x: auto; margin: 0 0 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    .content table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .content th, .content td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text-secondary); line-height: 1.6; }
    .content th { color: var(--text); font-weight: 600; }
    .content tr:last-child td { border-bottom: 0; }
    .content .form-box { background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; padding: 18px 20px; margin: 0 0 20px; }
    .content .form-box p { margin-bottom: 10px; }
    .content .form-box .small { font-size: 0.85rem; margin: 0; }
    .content .inline-btn { color: var(--accent); text-decoration: underline; font: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    @media (max-width: 640px) {
      .content .table-wrap { border: 0; background: none; overflow: visible; }
      .content table, .content tbody, .content tr, .content td { display: block; width: 100%; }
      .content thead { display: none; }
      .content tr { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; padding: 6px 0; }
      .content td { border: 0; padding: 4px 14px; }
      .content td::before { content: attr(data-label); display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    }
    .content h2[id], .content h3[id] { scroll-margin-top: 96px; }
    .content .operator { margin-top: 40px; font-size: 0.85rem; color: var(--text-muted); }

    .content blockquote { border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 10px 10px 0; padding: 12px 16px; margin: 0 0 16px; }
    .content blockquote p { margin: 0; font-style: italic; color: var(--text); }
    .content li ul { margin: 8px 0 0; }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 36px 0;
    }
    .footer-inner {
      max-width: 1120px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    footer p { font-size: 0.75rem; color: var(--text-muted); }
    .footer-links { display: flex; gap: 12px 20px; flex-wrap: wrap; justify-content: center; }
    .footer-links a, .footer-links button {
      font-size: 0.75rem; color: var(--text-muted);
      text-decoration: none; transition: color 0.15s;
    }
    .footer-links a:hover, .footer-links button:hover { color: var(--accent); }

    @media (max-width: 640px) {
      .footer-inner { flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="/" class="logo">
        <div class="logo-mark"><img src="/norselift-icon-192.png" alt="NorseLift" /></div>
        NorseLift
      </a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </nav>

  <div class="content">
    <div class="container" style="text-align:center; padding-top:48px; padding-bottom:48px;">
      <p class="updated">404</p>
      <h1>Page not found</h1>
      <p>The page you were looking for doesn't exist or has moved.</p>
      <p style="margin-top:24px;">
        <a href="/" style="display:inline-block; padding:12px 22px; border-radius:10px; background:var(--accent); color:var(--btn-accent-text); text-decoration:none; font-weight:600;">Go to the homepage</a>
        &nbsp;
        <a href="/blog">Read the blog</a>
      </p>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <p>&copy; 2026 NorseLift. Forged in Norway.</p>
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="https://app.norselift.com">App</a>
        <a href="/blog">Blog</a>
        <a href="/terms">Terms</a>
        <a href="/privacy">Privacy</a>
        <a href="/withdrawal">Withdrawal</a>
        <a href="mailto:support@norselift.com">Support</a>
        <button type="button" data-cookie-settings>Cookie settings</button>
      </div>
    </div>
  </footer>

  <script>
    function toggleTheme() {
      var html = document.documentElement;
      var current = html.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('norselift-theme', next);
      var meta = document.getElementById('meta-theme');
      if (meta) meta.setAttribute('content', next === 'dark' ? '#0a0e1a' : '#e6eef8');
    }
  </script>


</body>
</html>
